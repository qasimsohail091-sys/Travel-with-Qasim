<body>

 
  <header class="navbar">

  <section>
    <div class="container">
      <div class="gallery-grid">

        <div class="gallery-item">
          <img src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?auto=format&fit=crop&w=800&q=80" alt="Snow-capped mountain peak" />
        </div>
        <div class="gallery-item">
          <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=800&q=80" alt="Calm blue lake surrounded by mountains" />
        </div>
        <div class="gallery-item">
          <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=800&q=80" alt="Green valley with a winding river" />
        </div>
        <div class="gallery-item">
          <img src="https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?auto=format&fit=crop&w=800&q=80" alt="City skyline at sunset" />
        </div>
        <div class="gallery-item">
          <img src="https://images.unsplash.com/photo-1519046904884-53103b34b206?auto=format&fit=crop&w=800&q=80" alt="Mountain range under a clear sky" />
        </div>
        <div class="gallery-item">
          <img src="https://images.unsplash.com/photo-1502602898657-3e91760cbb34?auto=format&fit=crop&w=800&q=80" alt="Sun rising over layered mountains" />
        </div>
        <div class="gallery-item">
          <img src="https://images.unsplash.com/photo-1441716844725-09cedc13a4e7?auto=format&fit=crop&w=800&q=80" alt="Forest covered hills in fog" />
        </div>
        <div class="gallery-item">
          <img src="https://images.unsplash.com/photo-1541432901042-2d8bd64b4a9b?auto=format&fit=crop&w=800&q=80" alt="Historic tourist attraction building" />
        </div>

      </div>
    </div>
  </section>

  
  <div class="modal-overlay" id="imageModal">
    <div class="modal-box image-modal-box">
      <button class="modal-close" id="imageModalClose">&times;</button>
      <img id="imageModalPic" src="" alt="" />
